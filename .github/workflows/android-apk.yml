name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'game.html'
      - 'style.css'
      - 'script.js'
      - 'game-engine.js'
      - 'tests/**'
      - 'package.json'
      - 'capacitor.config.json'
      - 'manifest.webmanifest'
      - 'icon.svg'
      - 'sw.js'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Run game tests
        run: npm test
      - name: Check JavaScript syntax
        run: node --check script.js && node --check game-engine.js
      - name: Prepare Capacitor web assets
        run: |
          mkdir -p www
          cp index.html game.html style.css script.js game-engine.js manifest.webmanifest icon.svg sw.js www/
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: number-journey-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
