<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2048 — Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090d1c;color:#f4f7ff;font-family:Tahoma,Arial,sans-serif;padding:20px}main{width:min(520px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-weight:800;font-size:20px}.brand b{color:#c7f36b}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}h1{font-size:32px;line-height:1.35;margin:8px 0}h1 em{font-style:normal;color:#c7f36b}.muted{color:#91a0ba;font-size:12px}.hero{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:90px;transform:rotate(7deg)}.hero span{aspect-ratio:1;display:grid;place-items:center;background:#c7f36b;color:#18230d;border-radius:12px;font-size:20px;font-weight:800}.hero span:nth-child(2){background:#283a51;color:#9cb5d6}.hero span:nth-child(3){background:#6de4d2}.hero span:nth-child(4){background:#e5a65e}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{padding:10px;border:1px solid #26334d;border-radius:14px;background:#11182b}.stat small,.stat span{display:block;color:#91a0ba;font-size:9px}.stat strong{display:block;font-size:22px;margin:3px 0}.stat:nth-child(2) strong{color:#c7f36b}.stat:nth-child(3) strong{color:#6de4d2}.mission{padding:12px;border:1px solid #26334d;border-radius:14px;background:#11182b;margin-bottom:18px}.mission-row{display:flex;justify-content:space-between;font-size:11px}.track{height:6px;background:#293750;border-radius:9px;margin:10px 0 5px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#6de4d2,#c7f36b);transition:width .2s}.game-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:8px}.board-frame{position:relative;padding:10px;border-radius:20px;background:#111a2b;border:1px solid #34445e;box-shadow:0 18px 48px #0006}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:none;user-select:none}.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:12px;background:#202c41;color:#fff;font-size:clamp(20px,7vw,36px);font-weight:800;transform:translate3d(0,0,0);backface-visibility:hidden}.cell[data-v="2"]{background:#d9f28a;color:#283616}.cell[data-v="4"]{background:#a8e5ad;color:#173b29}.cell[data-v="8"]{background:#75d9d0;color:#103c3b}.cell[data-v="16"]{background:#67bce8;color:#12344c}.cell[data-v="32"]{background:#7c9bea;color:#172b55}.cell[data-v="64"]{background:#a18ce8;color:#302052}.cell[data-v="128"]{background:#d18fe2;color:#48234e;font-size:28px}.cell[data-v="256"]{background:#e89ebd;color:#4a2035;font-size:27px}.cell[data-v="512"]{background:#f0b47b;color:#4d2b12;font-size:26px}.cell[data-v="1024"]{background:#f1d16c;color:#4a390e;font-size:23px}.cell[data-v="2048"]{background:#c7f36b;color:#273b0b;font-size:22px;box-shadow:0 0 18px #c7f36b66}.controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:7px;margin-top:10px}.btn{min-height:46px;border:1px solid #33435c;border-radius:12px;background:#18243a;color:#dbe4f4;font-weight:700;cursor:pointer}.primary{background:#c7f36b;color:#1b2a0e;border-color:transparent}.btn:disabled{opacity:.4}.overlay{position:absolute;inset:10px;border-radius:14px;background:#09101df2;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}.hidden{display:none!important}.overlay h2{margin:8px 0}.overlay p{color:#aebbd1;font-size:12px}.pop{animation:pop .18s ease}@keyframes pop{0%{transform:scale(.82)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
</style>
</head>
<body>
<main>
<div class="top"><div class="brand">NUMBER <b>LAB</b></div><button id="theme" class="btn">☼</button></div>
<section class="intro"><div><div class="muted">EDITION 2027</div><h1>فكّر بذكاء.<br><em>ادمج بلا حدود.</em></h1><div class="muted">اسحب في أي اتجاه لبدء اللعب</div></div><div class="hero"><span>2</span><span>0</span><span>4</span><span>8</span></div></section>
<section class="stats"><div class="stat"><span>النقاط</span><strong id="score">٠</strong><small>SCORE</small></div><div class="stat"><span>الأفضل</span><strong id="best">٠</strong><small>BEST</small></div><div class="stat"><span>الحركات</span><strong id="moves">٠</strong><small>MOVES</small></div></section>
<section class="mission"><div class="mission-row"><b>الوصول إلى 2048</b><b id="percent">0%</b></div><div class="track"><div id="fill" class="fill"></div></div><div id="label" class="muted">ابدأ رحلتك الآن</div></section>
<section><div class="game-title"><b>ساحة اللعب</b><span class="muted">LIVE</span></div><div class="board-frame"><div id="board" class="board" role="grid"></div><div id="overlay" class="overlay hidden"><h2 id="otitle"></h2><p id="otext"></p><button id="orestart" class="btn primary">ابدأ من جديد ↻</button></div></div><div class="controls"><button id="undo" class="btn" disabled>↶ تراجع</button><button id="new" class="btn primary">لعبة جديدة ＋</button><button id="hint" class="btn">✧ مساعدة</button></div></section>
</main>
<script>
"use strict";
const G=(()=>{const empty=()=>Array(16).fill(0);const rnd=()=>Math.random();function spawn(b){const free=[];b.forEach((v,i)=>{if(!v)free.push(i)});if(!free.length)return b.slice();const o=b.slice(),i=free[Math.floor(rnd()*free.length)];o[i]=rnd()<.9?2:4;return o}function initial(){return spawn(spawn(empty()))}function move(b,d){const o=b.slice();let score=0,merged=[];for(let line=0;line<4;line++){const ids=[];for(let p=0;p<4;p++)ids.push(d==='left'?line*4+p:d==='right'?line*4+3-p:d==='up'?p*4+line:(3-p)*4+line);const vals=ids.map(i=>b[i]).filter(Boolean),next=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){next.push(vals[i]*2);score+=vals[i]*2;merged.push(ids[next.length-1]);i++}else next.push(vals[i])}ids.forEach((id,j)=>o[id]=next[j]||0)}return{board:o,score,merged,changed:o.some((v,i)=>v!==b[i])}}function can(b){return b.some(v=>!v)||b.some((v,i)=>i%4<3&&v===b[i+1])||b.some((v,i)=>i<12&&v===b[i+4])}return{initial,spawn,move,can}})();
const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('ar-EG').format(n);let board=G.initial(),score=0,best=Number(localStorage.getItem('preview2048Best')||0),moves=0,undo=null,over=false,drag=null,animating=false;const cells=[];for(let i=0;i<16;i++){const c=document.createElement('div');c.className='cell';c.dataset.v='';c.dataset.index=i;cells.push(c);$('board').append(c)}
function draw(){cells.forEach((c,i)=>{const v=board[i];c.dataset.v=v||'';c.textContent=v?fmt(v):''});$('score').textContent=fmt(score);$('best').textContent=fmt(best);$('moves').textContent=fmt(moves);const max=Math.max(0,...board),p=Math.min(100,max/2048*100);$('fill').style.width=p+'%';$('percent').textContent=Math.floor(p)+'%';$('label').textContent=max?'أعلى بلاطة: '+fmt(max):'ابدأ رحلتك الآن';$('undo').disabled=!undo}
function reset(){board=G.initial();score=0;moves=0;undo=null;over=false;animating=false;$('overlay').classList.add('hidden');draw()}
function move(d){if(over||animating)return;const r=G.move(board,d);if(!r.changed)return;undo={board:board.slice(),score,moves};board=G.spawn(r.board);score+=r.score;moves++;if(score>best){best=score;localStorage.setItem('preview2048Best',best)}animating=true;draw();r.merged.forEach(i=>{cells[i].classList.remove('pop');void cells[i].offsetWidth;cells[i].classList.add('pop')});setTimeout(()=>{animating=false; if(!G.can(board)){over=true;$('otitle').textContent='انتهت اللعبة';$('otext').textContent='نتيجتك '+fmt(score)+' نقطة';$('overlay').classList.remove('hidden')}},170)}
function swipe(dx,dy){if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))}
$('board').addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};$('board').setPointerCapture?.(e.pointerId)});$('board').addEventListener('pointerup',e=>{if(!drag||drag.id!==e.pointerId)return;swipe(e.clientX-drag.x,e.clientY-drag.y);drag=null});$('board').addEventListener('pointercancel',()=>drag=null);document.addEventListener('keydown',e=>{const m={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(m[e.key]){e.preventDefault();move(m[e.key])}});$('new').onclick=reset;$('orestart').onclick=reset;$('undo').onclick=()=>{if(!undo||animating)return;board=undo.board;score=undo.score;moves=undo.moves;undo=null;over=false;$('overlay').classList.add('hidden');draw()};$('hint').onclick=()=>{alert('حافظ على أكبر رقم في أحد الأركان، ولا تملأ اللوحة بسرعة.')};$('theme').onclick=()=>document.body.classList.toggle('light');draw();
</script>
</body>
</html>
